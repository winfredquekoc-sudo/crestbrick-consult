<!--
  Crestbrick district chart components
  ======================================
  Five self-contained inline-SVG snippets the Python generator interpolates into
  district pages. No external JS, no build step, no framework.

  Brand tokens (already in :root on every page):
    --bg:#faf8f4  --ink:#1a1a1a  --ink-soft:#4a4a4a  --ink-muted:#7a7a7a
    --accent:#8b6f47  --rule:#e6e0d6

  Convention:
    - Each component is a Python function returning an HTML string.
    - All inputs tolerant of None / empty: functions return "" (empty string)
      when data is missing — the generator should simply concatenate; no
      broken boxes will render.
    - Each component accepts an optional caption= parameter. When provided,
      the caption renders in <figcaption> beneath the chart in italic serif.
    - Charts use viewBox + preserveAspectRatio so they scale inside any
      parent column. Max width is set to 100%.
    - Scoped .cb-chart-* classes avoid collision with Tailwind utilities.

  Shared CSS (inject ONCE per page, in the existing <style> block):
  ======================================================================
-->

<style>
  /* Chart base */
  .cb-chart{margin:2rem 0;}
  .cb-chart figcaption{font-family:'Fraunces',Georgia,serif;font-style:italic;color:var(--ink-soft);font-size:15px;line-height:1.55;margin-top:.9rem;text-wrap:balance;}
  .cb-chart-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-muted);font-weight:600;}
  .cb-chart-value{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--ink);}
  .cb-chart svg{display:block;width:100%;height:auto;overflow:visible;}
  .cb-chart svg text{font-family:'Inter',-apple-system,sans-serif;}
  /* Tier-median ticks */
  .cb-tier-tick{stroke:var(--ink-muted);stroke-width:1;stroke-dasharray:2 3;}
  /* Shared band fills */
  .cb-band{fill:var(--accent);fill-opacity:.78;}
  .cb-band-soft{fill:var(--rule);}
  .cb-axis{stroke:var(--rule);stroke-width:1;}
  .cb-axis-tick-text{fill:var(--ink-muted);font-size:11px;}
  .cb-title{fill:var(--ink);font-size:13px;font-weight:600;letter-spacing:.02em;}
  /* Travel ribbon thresholds */
  .cb-trav-good{fill:#5c7a3c;} /* <20 min */
  .cb-trav-ok  {fill:var(--accent);} /* 20-35 */
  .cb-trav-slow{fill:#9a5a3c;} /* >35 */
  /* Supply dots */
  .cb-supply-dot{fill:var(--accent);}
  .cb-supply-ring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:.35;}
  /* Region spectrum */
  .cb-region-marker{fill:var(--ink);}
  .cb-region-track{fill:var(--rule);}
  /* Mobile tweaks */
  @media (max-width:640px){
    .cb-chart svg text{font-size:11px;}
    .cb-chart figcaption{font-size:14px;}
  }
</style>

<!--
  ======================================================================
  PYTHON HELPERS — paste at top of _render_area_pages.py (or a sibling
  module) and import. All return empty string on missing data.
  ======================================================================

def _cb_fig(body_svg, caption=None, aria=""):
    cap = f'<figcaption>{caption}</figcaption>' if caption else ''
    role = f' role="img" aria-label="{aria}"' if aria else ''
    return f'<figure class="cb-chart"{role}>{body_svg}{cap}</figure>'


# A. PSF range bar — district band vs CCR/RCR/OCR medians
def psf_range_bar(low, high, ccr_med, rcr_med, ocr_med, caption=None):
    if not (low and high and ccr_med and rcr_med and ocr_med):
        return ""
    # Axis: 1000..4000 psf covers full Singapore spread; clamp inputs.
    AX_MIN, AX_MAX = 1000, 4000
    def pos(v):
        v = max(AX_MIN, min(AX_MAX, v))
        return 40 + (v - AX_MIN) / (AX_MAX - AX_MIN) * 680   # 40..720
    x1, x2 = pos(low), pos(high)
    cx, rx, ox = pos(ccr_med), pos(rcr_med), pos(ocr_med)
    svg = f'''
<svg viewBox="0 0 760 180" preserveAspectRatio="xMidYMid meet">
  <text x="40" y="22" class="cb-title">$PSF range · this district vs tier medians</text>
  <line x1="40" y1="110" x2="720" y2="110" class="cb-axis"/>
  <rect x="{x1:.1f}" y="86" width="{(x2-x1):.1f}" height="28" rx="3" class="cb-band"/>
  <text x="{x1:.1f}" y="78" class="cb-axis-tick-text">${int(low):,}</text>
  <text x="{x2:.1f}" y="78" text-anchor="end" class="cb-axis-tick-text">${int(high):,}</text>
  <line x1="{cx:.1f}" y1="72" x2="{cx:.1f}" y2="128" class="cb-tier-tick"/>
  <text x="{cx:.1f}" y="146" text-anchor="middle" class="cb-axis-tick-text">CCR ${int(ccr_med):,}</text>
  <line x1="{rx:.1f}" y1="72" x2="{rx:.1f}" y2="128" class="cb-tier-tick"/>
  <text x="{rx:.1f}" y="162" text-anchor="middle" class="cb-axis-tick-text">RCR ${int(rcr_med):,}</text>
  <line x1="{ox:.1f}" y1="72" x2="{ox:.1f}" y2="128" class="cb-tier-tick"/>
  <text x="{ox:.1f}" y="146" text-anchor="middle" class="cb-axis-tick-text">OCR ${int(ocr_med):,}</text>
  <text x="40"  y="170" class="cb-axis-tick-text">$1,000</text>
  <text x="720" y="170" text-anchor="end" class="cb-axis-tick-text">$4,000 psf</text>
</svg>'''
    return _cb_fig(svg, caption, aria=f"PSF range ${int(low):,}–${int(high):,}")


# B. Yield meter — district band on a 2–5% gauge, 3% floor annotated
def yield_meter(low, high, caption=None):
    if not (low and high):
        return ""
    AX_MIN, AX_MAX = 2.0, 5.0
    def pos(v):
        v = max(AX_MIN, min(AX_MAX, v))
        return 40 + (v - AX_MIN) / (AX_MAX - AX_MIN) * 680
    x1, x2 = pos(low), pos(high)
    fx = pos(3.0)   # 3% floor
    svg = f'''
<svg viewBox="0 0 760 150" preserveAspectRatio="xMidYMid meet">
  <text x="40" y="22" class="cb-title">Gross rental yield · typical band</text>
  <rect x="40" y="70" width="680" height="22" rx="2" class="cb-band-soft"/>
  <rect x="{x1:.1f}" y="70" width="{(x2-x1):.1f}" height="22" rx="2" class="cb-band"/>
  <line x1="{fx:.1f}" y1="60" x2="{fx:.1f}" y2="102" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="{fx:.1f}" y="54" text-anchor="middle" fill="var(--ink)" font-size="11" font-weight="600">3% floor</text>
  <text x="{x1:.1f}" y="116" class="cb-axis-tick-text">{low:.1f}%</text>
  <text x="{x2:.1f}" y="116" text-anchor="end" class="cb-axis-tick-text">{high:.1f}%</text>
  <text x="40"  y="138" class="cb-axis-tick-text">2%</text>
  <text x="720" y="138" text-anchor="end" class="cb-axis-tick-text">5%</text>
</svg>'''
    return _cb_fig(svg, caption, aria=f"Yield band {low:.1f}–{high:.1f}%")


# C. Travel-times ribbon — 3 bars (CBD / Orchard / Changi), threshold-coloured
def travel_times_ribbon(cbd, orchard, changi, caption=None):
    if not any([cbd, orchard, changi]):
        return ""
    AX_MAX = 60  # minutes scale
    rows = [("CBD (Raffles Pl)", cbd), ("Orchard", orchard), ("Changi Airport", changi)]
    bar_h, gap, top = 26, 14, 40
    parts = ['<svg viewBox="0 0 760 200" preserveAspectRatio="xMidYMid meet">']
    parts.append('<text x="40" y="22" class="cb-title">Drive-time from district · off-peak minutes</text>')
    for i, (label, mins) in enumerate(rows):
        if not mins:
            continue
        y = top + i * (bar_h + gap)
        w = min(mins, AX_MAX) / AX_MAX * 560
        cls = "cb-trav-good" if mins < 20 else ("cb-trav-ok" if mins <= 35 else "cb-trav-slow")
        parts.append(f'<text x="40" y="{y+17}" fill="var(--ink-soft)" font-size="12">{label}</text>')
        parts.append(f'<rect x="160" y="{y}" width="560" height="{bar_h}" rx="3" class="cb-band-soft"/>')
        parts.append(f'<rect x="160" y="{y}" width="{w:.1f}" height="{bar_h}" rx="3" class="{cls}"/>')
        parts.append(f'<text x="{160+w+8:.1f}" y="{y+17}" class="cb-value" fill="var(--ink)" font-size="12" font-weight="600">{mins} min</text>')
    parts.append('<text x="160" y="175" class="cb-axis-tick-text">0</text>')
    parts.append('<text x="720" y="175" text-anchor="end" class="cb-axis-tick-text">60 min</text>')
    parts.append('</svg>')
    return _cb_fig("".join(parts), caption, aria="Travel times to key nodes")


# D. Supply timeline — dots on 2026–2028 axis; empty string if no launches
def supply_timeline(launches, caption=None):
    if not launches:
        return ""
    YEARS = [2026, 2027, 2028]
    year_x = {y: 80 + i * 300 for i, y in enumerate(YEARS)}   # 80, 380, 680
    parts = ['<svg viewBox="0 0 760 200" preserveAspectRatio="xMidYMid meet">']
    parts.append('<text x="40" y="22" class="cb-title">Upcoming supply · 2026–2028 launches</text>')
    parts.append('<line x1="80" y1="100" x2="680" y2="100" class="cb-axis" stroke-width="1.5"/>')
    for y, x in year_x.items():
        parts.append(f'<line x1="{x}" y1="92" x2="{x}" y2="108" class="cb-axis" stroke-width="1.5"/>')
        parts.append(f'<text x="{x}" y="130" text-anchor="middle" class="cb-axis-tick-text">{y}</text>')
    # cluster stacking per year
    counts = {y: 0 for y in YEARS}
    for L in launches:
        y = L.get("year")
        if y not in year_x:
            continue
        counts[y] = counts[y] + 1
        offset = (counts[y] - 1) * 18
        cx = year_x[y]
        cy = 100 - 24 - offset
        parts.append(f'<circle cx="{cx}" cy="{cy}" r="7" class="cb-supply-dot"/>')
        parts.append(f'<circle cx="{cx}" cy="{cy}" r="11" class="cb-supply-ring"/>')
        name = (L.get("name") or "").replace("<", "&lt;")
        psf  = (L.get("psf_range") or "").replace("<", "&lt;")
        parts.append(f'<text x="{cx+16}" y="{cy+4}" fill="var(--ink)" font-size="11" font-weight="600">{name}</text>')
        if psf:
            parts.append(f'<text x="{cx+16}" y="{cy+18}" class="cb-axis-tick-text">{psf}</text>')
    parts.append('</svg>')
    return _cb_fig("".join(parts), caption, aria=f"{len(launches)} upcoming launches")


# E. Region spectrum — horizontal CCR→RCR→OCR with district marker
def region_spectrum(region, caption=None):
    if region not in ("CCR", "RCR", "OCR"):
        return ""
    pos_map = {"CCR": 120, "RCR": 380, "OCR": 640}
    mx = pos_map[region]
    svg = f'''
<svg viewBox="0 0 760 140" preserveAspectRatio="xMidYMid meet">
  <text x="40" y="22" class="cb-title">Where this district sits · region spectrum</text>
  <rect x="80" y="66" width="600" height="6" rx="3" class="cb-region-track"/>
  <circle cx="120" cy="69" r="5" fill="var(--ink-muted)"/>
  <circle cx="380" cy="69" r="5" fill="var(--ink-muted)"/>
  <circle cx="640" cy="69" r="5" fill="var(--ink-muted)"/>
  <text x="120" y="98" text-anchor="middle" class="cb-axis-tick-text">CCR · prime</text>
  <text x="380" y="98" text-anchor="middle" class="cb-axis-tick-text">RCR · city-fringe</text>
  <text x="640" y="98" text-anchor="middle" class="cb-axis-tick-text">OCR · suburban</text>
  <path d="M {mx-8} 48 L {mx+8} 48 L {mx} 62 Z" class="cb-region-marker"/>
  <text x="{mx}" y="40" text-anchor="middle" fill="var(--ink)" font-size="12" font-weight="700">{region}</text>
</svg>'''
    return _cb_fig(svg, caption, aria=f"Region tier: {region}")
-->
