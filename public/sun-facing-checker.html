<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sun Facing Checker Singapore: Sun Direction &amp; Shadow Map</title>
<meta name="description" content="Free Sun Facing Checker for any Singapore address. See which way a home faces the sun, when the west sun hits, and which buildings cast shadows, for any month and time of day.">
<meta property="og:title" content="Sun Facing Checker Singapore: Sun Direction &amp; Shadow Map">
<meta property="og:description" content="Free Sun Facing Checker for any Singapore address. See which way a home faces the sun, when the west sun hits, and which buildings cast shadows, for any month and time of day.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://winfredquek.com/sun-facing-checker">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
  :root{
    --navy:#132033; --navy2:#1c2e49; --gold:#c9a24b; --ink:#0f1826;
    --paper:#f5f6f8; --line:#dfe4ec; --muted:#5b6678;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;height:100vh;height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--navy)}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{font-size:10px}
  /* control panel */
  #panel{position:absolute;z-index:5;top:14px;left:14px;width:320px;max-width:calc(100vw - 28px);
    background:rgba(19,32,51,.94);color:#eef2f8;border:1px solid rgba(201,162,75,.35);border-radius:14px;
    box-shadow:0 10px 34px rgba(0,0,0,.4);backdrop-filter:blur(6px);overflow-x:hidden}
  .sheet-handle{display:none}
  @media (min-width:641px){
    #panel{max-height:calc(100vh - 20px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(201,162,75,.4) transparent}
    #panel::-webkit-scrollbar{width:6px}
    #panel::-webkit-scrollbar-track{background:transparent}
    #panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
  }
  #panel .hd{padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
  #panel .hdtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  #panel .hd h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
  #panel .hd h1 span{color:var(--gold)}
  .homelink{font-size:10px;color:#7c8aa0;text-decoration:none;white-space:nowrap;flex:none}
  .homelink:hover{color:var(--gold)}
  .tabrow{display:flex;gap:14px;margin-top:8px}
  .tabrow .tab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7c8aa0;text-decoration:none;
    padding-bottom:2px;border-bottom:2px solid transparent}
  .tabrow .tab.active{color:var(--gold);border-bottom-color:var(--gold)}
  .tabrow a.tab:hover{color:#eef2f8}
  .wa-mini{display:none}
  #panel .hd p{margin:6px 0 0;font-size:11.5px;color:#9fb0c6;line-height:1.4}
  #panel .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
  .search{display:flex;gap:6px}
  .search input{flex:1;min-width:0;background:#0f1a2b;border:1px solid rgba(255,255,255,.14);color:#eef2f8;
    border-radius:8px;padding:8px 10px;font-size:13px}
  .search button,.btn{background:var(--gold);color:#1a1408;border:0;border-radius:8px;padding:8px 12px;
    font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .search button:hover,.btn:hover{filter:brightness(1.06)}
  a.btn{text-decoration:none;display:inline-block;text-align:center}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9fb0c6}
  .val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--gold)}
  input[type=date]{background:#0f1a2b;border:1px solid rgba(255,255,255,.14);color:#eef2f8;border-radius:8px;padding:6px 8px;font-size:12.5px}
  .timeread{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .timeread small{font-size:13px;color:#9fb0c6;font-weight:500}
  .playrow{display:flex;gap:8px;align-items:center}
  .ghost{background:transparent;color:#eef2f8;border:1px solid rgba(255,255,255,.2);border-radius:8px;
    padding:7px 11px;font-size:12.5px;cursor:pointer}
  .ghost:hover{border-color:var(--gold)}
  .suninfo{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:12px}
  .suninfo div span{display:block;color:#9fb0c6;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
  .suninfo b{font-variant-numeric:tabular-nums}
  .note{font-size:10.5px;color:#8797ad;line-height:1.4;margin:0}
  .badge{position:absolute;z-index:5;top:14px;right:14px;background:rgba(19,32,51,.9);border:1px solid rgba(201,162,75,.3);
    color:#eef2f8;border-radius:10px;padding:8px 12px;font-size:11.5px;max-width:230px;line-height:1.4}
  .badge a{color:var(--gold)}
  #loading{position:absolute;z-index:6;bottom:20px;left:50%;transform:translateX(-50%);
    background:rgba(19,32,51,.95);color:#eef2f8;border:1px solid rgba(201,162,75,.3);border-radius:20px;
    padding:8px 16px;font-size:12.5px;display:none}
  #loading.on{display:block}

  /* CTA strip */
  .cta{border:1px solid rgba(201,162,75,.5);background:rgba(201,162,75,.08);border-radius:10px;padding:12px;
    display:flex;flex-direction:column;gap:8px}
  .cta p{margin:0;font-size:12px;line-height:1.45;color:#eef2f8}
  .cta .calllink{font-size:11px;color:#9fb0c6;text-decoration:underline;text-align:center}
  .cta .calllink:hover{color:var(--gold)}

  /* Sun summary */
  .summarywrap{display:flex;flex-direction:column;gap:10px;width:100%}
  #summaryBtn[disabled]{opacity:.7;cursor:wait}
  .summarycard{width:100%;border:1px solid rgba(255,255,255,.12);border-radius:10px;
    padding:10px 12px;font-size:11.5px;line-height:1.6;display:flex;flex-direction:column;gap:10px}
  .summarycard p{margin:0}
  .summarycard table{width:100%;border-collapse:collapse;font-size:12px}
  .summarycard th,.summarycard td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;white-space:nowrap}
  .summarycard th{color:#9fb0c6;font-weight:600}
  .summaryemail{display:flex;gap:6px;flex-wrap:wrap}
  .summaryemail input[type=email]{flex:1;min-width:120px;background:#0f1a2b;border:1px solid rgba(255,255,255,.14);
    color:#eef2f8;border-radius:8px;padding:8px 10px;font-size:13px}
  .summarymsg{font-size:11px;color:#9fb0c6;margin:0}
  .hp{position:absolute;left:-9999px;opacity:0;pointer-events:none}

  /* WhatsApp float */
  #wa-float{position:fixed;bottom:20px;right:20px;z-index:50;display:flex;align-items:center;gap:8px;
    border-radius:999px;background:#25D366;color:#fff;padding:12px 20px;font-weight:600;font-size:14px;
    text-decoration:none;box-shadow:0 10px 30px -5px rgba(37,211,102,.4)}
  #wa-float svg{width:18px;height:18px;flex:none}
  @keyframes wa-pulse{
    0%,100%{box-shadow:0 10px 30px -5px rgba(37,211,102,.4), 0 0 0 0 rgba(37,211,102,.55)}
    50%{box-shadow:0 10px 30px -5px rgba(37,211,102,.4), 0 0 0 14px rgba(37,211,102,0)}
  }
  #wa-float.wa-pulsing,.wa-mini.wa-pulsing{animation:wa-pulse 1s ease-out 2}

  @media (max-width:640px){
    #panel{top:auto;left:0;right:0;bottom:0;width:100%;max-width:100%;border-radius:18px 18px 0 0;
      height:46vh;transition:height .22s ease;display:flex;flex-direction:column;
      padding-bottom:env(safe-area-inset-bottom)}
    #panel.collapsed{height:172px}
    #panel.collapsed .hd p{display:none}
    #panel.expanded{height:80vh}
    .sheet-handle{display:block;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);
      margin:8px auto 0;flex:none}
    #panel .bd{overflow-y:auto;flex:1}
    .search input,.search button,.btn,.ghost,#summaryBtn{font-size:16px;min-height:44px}
    input[type=range]{height:30px}
    .wa-mini{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;
      background:#25D366;color:#fff;flex:none}
    .wa-mini svg{width:17px;height:17px}
    #wa-float{display:none}
    .badge{display:none}
  }
</style>
