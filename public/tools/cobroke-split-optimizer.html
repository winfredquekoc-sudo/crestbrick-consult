<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Co-Broke Commission Split Optimiser · Winfred Quek</title>
<meta name="description" content="Calculate fair Singapore co-broke commission splits based on deal size, lead source, and work distribution. Free tool by Winfred Quek, CEA R073319H.">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="canonical" href="https://winfredquek.com/tools/cobroke-split-optimizer" />
<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:-apple-system,system-ui,sans-serif;background:#0e0c08;color:#f0e9d8;min-height:100vh;padding:32px 16px;line-height:1.6;}.wrap{max-width:560px;margin:0 auto;}h1{font-family:'Fraunces',serif;font-size:28px;font-weight:400;margin:6px 0 16px;}.lead{color:#a89980;margin-bottom:24px;}.card{background:#1a1610;border:1px solid rgba(180,140,80,0.2);border-radius:12px;padding:24px;margin-bottom:18px;}label{display:block;margin-bottom:14px;}label span{display:block;font-size:13px;color:#a89980;margin-bottom:4px;}input,select{width:100%;padding:10px 12px;background:#0e0c08;border:1px solid rgba(180,140,80,0.3);border-radius:6px;color:#f0e9d8;}.row{display:flex;gap:14px;}.row label{flex:1;}.btn{background:#b48c50;color:#0e0c08;padding:12px 24px;border-radius:8px;border:none;cursor:pointer;font-weight:500;width:100%;}.result{display:none;margin-top:24px;}.result.show{display:block;}.row-r{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(180,140,80,0.1);}.row-r:last-child{font-weight:600;color:#b48c50;font-size:18px;border-bottom:none;}</style>
<link rel="stylesheet" href="/_a11y-fixes.css"><script defer src="/_enhance.js"></script><script defer src="/_schema.js"></script><script defer src="/_nav.js"></script></head><body><div class="wrap">
<h1>Co-Broke Commission Split</h1>
<div class="lead">Industry default is 50/50. The math says it should depend on lead source, marketing, viewing effort.</div>
<div class="card">
<label><span>Deal price (S$)</span><input id="price" type="number" value="2000000"/></label>
<div class="row">
<label><span>Total commission rate (%)</span><input id="rate" type="number" value="2" step="0.1"/></label>
<label><span>Who has the listing?</span><select id="listing">
<option value="me">I do (seller side)</option>
<option value="other" selected>Other agent (buyer side)</option>
</select></label>
</div>
<label><span>Lead source</span><select id="lead">
<option value="me">I sourced the buyer</option>
<option value="other">Other agent sourced</option>
<option value="shared">Shared/walk-in</option>
</select></label>
<label><span>Workload split during deal</span><select id="work">
<option value="balanced">Balanced 50/50</option>
<option value="me_more">I did 70%+</option>
<option value="other_more">Other agent did 70%+</option>
</select></label>
<button class="btn" onclick="calc()">Calculate split</button>
</div>
<div id="result" class="result">
<div class="card">
<div class="row-r"><span>Total commission</span><span id="total"></span></div>
<div class="row-r"><span>My share</span><span id="mine"></span></div>
<div class="row-r"><span>Other agent's share</span><span id="theirs"></span></div>
<div class="row-r"><span>Suggested split</span><span id="split"></span></div>
</div>
<div style="color:#7a6c54;font-size:12px;line-height:1.6;" id="logic"></div>
</div>
<script>
function calc(){
const price=+document.getElementById('price').value;
const rate=+document.getElementById('rate').value/100;
const listing=document.getElementById('listing').value;
const lead=document.getElementById('lead').value;
const work=document.getElementById('work').value;
const total=price*rate;
let myPct=50;
if (listing==='me') myPct+=10; else myPct-=10;
if (lead==='me') myPct+=15; else if (lead==='other') myPct-=15;
if (work==='me_more') myPct+=15; else if (work==='other_more') myPct-=15;
myPct=Math.max(20,Math.min(80,myPct));
const mine=total*myPct/100;
const fmt=n=>'S$'+Math.round(n).toLocaleString();
document.getElementById('total').textContent=fmt(total);
document.getElementById('mine').textContent=fmt(mine);
document.getElementById('theirs').textContent=fmt(total-mine);
document.getElementById('split').textContent=`${myPct} / ${100-myPct}`;
document.getElementById('logic').innerHTML=`<b>How it's computed:</b> baseline 50/50 ± listing-side 10pp ± lead source 15pp ± work share 15pp. Capped at 20-80 either way. <br><br>If you're proposing this split to the other agent, frame it on contribution not entitlement.`;
document.getElementById('result').classList.add('show');
}
calc();
</script>
</div></body></html>
