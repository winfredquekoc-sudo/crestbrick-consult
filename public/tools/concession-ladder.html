<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Concession Ladder Generator · Winfred Quek</title>
<meta name="description" content="Generate a 5-step concession ladder with diminishing increments for property negotiation.">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:-apple-system,system-ui,sans-serif;background:#0e0c08;color:#f0e9d8;min-height:100vh;padding:32px 16px;line-height:1.6;}.wrap{max-width:560px;margin:0 auto;}h1{font-family:'Fraunces',serif;font-size:28px;font-weight:400;margin:6px 0 16px;}.lead{color:#a89980;margin-bottom:24px;}.card{background:#1a1610;border:1px solid rgba(180,140,80,0.2);border-radius:12px;padding:24px;margin-bottom:18px;}label{display:block;margin-bottom:14px;}label span{display:block;font-size:13px;color:#a89980;margin-bottom:4px;}input{width:100%;padding:10px 12px;background:#0e0c08;border:1px solid rgba(180,140,80,0.3);border-radius:6px;color:#f0e9d8;}.row{display:flex;gap:14px;}.row label{flex:1;}.btn{background:#b48c50;color:#0e0c08;padding:12px 24px;border-radius:8px;border:none;cursor:pointer;font-weight:500;width:100%;}.result{display:none;margin-top:24px;}.result.show{display:block;}.step{display:flex;justify-content:space-between;padding:12px;background:#171410;border-radius:6px;margin-bottom:8px;border-left:3px solid #b48c50;}.step .n{color:#b48c50;font-weight:600;}</style>
<link rel="stylesheet" href="/_a11y-fixes.css"><script defer src="/_enhance.js"></script><script defer src="/_schema.js"></script><script defer src="/_nav.js"></script></head><body><div class="wrap">
<h1>Concession Ladder</h1>
<div class="lead">Diminishing concessions tell the seller you're approaching your true ceiling. Linear concessions invite further bidding.</div>
<div class="card">
<div class="row">
<label><span>Your opening offer (S$)</span><input id="open" type="number" value="1750000"/></label>
<label><span>Your walk-away (S$)</span><input id="walk" type="number" value="1900000"/></label>
</div>
<button class="btn" onclick="calc()">Generate ladder</button>
</div>
<div id="result" class="result">
<div id="ladder"></div>
<div style="margin-top:16px;color:#7a6c54;font-size:12px;line-height:1.6;">Each step gets ~half the previous increment. Tells the seller you're hitting your ceiling. Linear "+S$10k each round" invites them to keep pushing.</div>
</div>
<script>
function calc(){
const open=+document.getElementById('open').value;
const walk=+document.getElementById('walk').value;
const room=walk-open;
if (room<=0){alert('Walk-away must be above opening.');return;}
const fmt=n=>'S$'+Math.round(n).toLocaleString();
// 5 diminishing concessions: 40%, 25%, 15%, 12%, 8% of room
const pcts=[0.40,0.25,0.15,0.12,0.08];
let cumulative=0;
const html=pcts.map((p,i)=>{cumulative+=room*p;const offer=open+cumulative;const inc=room*p;return `<div class="step"><span><span class="n">Round ${i+1}</span> &nbsp;&nbsp; +${fmt(inc)} from previous</span><span><b>${fmt(offer)}</b></span></div>`;}).join('');
document.getElementById('ladder').innerHTML=html;
document.getElementById('result').classList.add('show');
}
calc();
</script>
</div></body></html>
