<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Crestbrick Matchmaker</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matchmaker">
<style>
/*__CSS__*/
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div>
      <h1>🏠 Crestbrick Rental Matchmaker</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Matchmaker views">
    <div class="tab on" data-v="work" role="tab" tabindex="0" aria-selected="true" aria-controls="work" id="tab-work">⭐ Today's Worklist</div>
    <div class="tab" data-v="listing" role="tab" tabindex="0" aria-selected="false" aria-controls="listing" id="tab-listing">🏠 By Listing</div>
    <div class="tab" data-v="tenant" role="tab" tabindex="0" aria-selected="false" aria-controls="tenant" id="tab-tenant">🙋 By Tenant</div>
    <div class="tab" data-v="whole" role="tab" tabindex="0" aria-selected="false" aria-controls="whole" id="tab-whole">🏘 Whole Unit</div>
    <div class="tab" data-v="stats" role="tab" tabindex="0" aria-selected="false" aria-controls="stats" id="tab-stats">📊 Stats</div>
  </div>
  <div class="hrow" style="margin-top:8px">
    <button class="hbtn" id="addtenant" type="button">+ Tenant</button>
    <button class="hbtn" id="dispatchchip" type="button">Dispatch <span class="cnt">0</span></button>
    <button class="hbtn" id="snoozechip" type="button">Snoozed <span class="cnt">0</span></button>
    <button class="hbtn" id="palettebtn" type="button" title="Command palette">⌘K Find</button>
    <button class="hbtn" id="maskbtn" type="button" title="Toggle phone masking">🔒 Masked</button>
    <button class="hbtn" id="themebtn" type="button" title="Toggle day/night">🌙</button>
    <button class="hbtn" id="densitybtn" type="button" title="Toggle density">☰ Density</button>
  </div>
  <div class="filters">
    <input id="q" placeholder="Search tenant, landlord, district, area, postal…" aria-label="Search tenant, landlord, district, area, or postal code">
    <select id="fd" aria-label="Filter by district"><option value="">All districts</option></select>
    <select id="fv" aria-label="Filter by verdict">
      <option value="">All verdicts</option>
      <option value="QUALIFIED">Qualified</option>
      <option value="NEEDS_INFO">Needs info</option>
      <option value="BLOCKED">Has conflict</option>
    </select>
    <input id="fr" type="number" placeholder="Max rent $" style="width:120px" aria-label="Maximum rent filter">
    <label class="tog"><input type="checkbox" id="fc"> hide cold &gt;5d <span id="fccount" class="mut"></span></label>
    <label class="tog"><input type="checkbox" id="fh"> hide actioned <span id="fhcount" class="mut"></span></label>
    <button id="clr" class="tab">↺ Clear filters</button>
    <button id="bulkbtn" class="tab" type="button">☑ Bulk action</button>
  </div>
</header>
<main>
  <div id="work" role="tabpanel" aria-labelledby="tab-work"></div>
  <div id="listing" class="split" style="display:none" role="tabpanel" aria-labelledby="tab-listing">
    <div class="rail" id="lrail"></div>
    <div class="panel" id="lpanel"><div class="empty">Pick a listing on the left to see ranked tenants.</div></div>
  </div>
  <div id="tenant" class="split" style="display:none" role="tabpanel" aria-labelledby="tab-tenant">
    <div class="rail" id="trail"></div>
    <div class="panel" id="tpanel"><div class="empty">Pick a tenant on the left to see matching available listings.</div></div>
  </div>
  <div id="whole" style="display:none" role="tabpanel" aria-labelledby="tab-whole"></div>
  <div id="stats" style="display:none" role="tabpanel" aria-labelledby="tab-stats"></div>
  <div class="legend" id="legend"></div>
</main>
<script>const DATA = __DATA__;</script>
<script>
__SCORING__
</script>
<script>
__APP_JS__
</script>
</body>
</html>
