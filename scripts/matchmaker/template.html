<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Crestbrick Matchmaker</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matchmaker">
<style>/*__LEAFLET_CSS__*/</style>
<script>/*__LEAFLET_JS__*/</script>
<style>
/*__CSS__*/
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div>
      <h1>🏠 Crestbrick Rental Matchmaker</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <span class="chip mut" id="syncPill" title="CRM sync status">▣ local only</span>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Matchmaker views">
    <div class="tab on" data-v="mapview" role="tab" tabindex="0" aria-selected="true" aria-controls="mapview" id="tab-mapview" data-icon="🗺">Dashboard</div>
    <div class="tab" data-v="work" role="tab" tabindex="0" aria-selected="false" aria-controls="work" id="tab-work" data-icon="⭐">Today's Worklist</div>
    <div class="tab" data-v="pipeline" role="tab" tabindex="0" aria-selected="false" aria-controls="pipeline" id="tab-pipeline" data-icon="📈">Pipeline</div>
    <div class="tab" data-v="listing" role="tab" tabindex="0" aria-selected="false" aria-controls="listing" id="tab-listing" data-icon="🏠">By Listing</div>
    <div class="tab" data-v="tenant" role="tab" tabindex="0" aria-selected="false" aria-controls="tenant" id="tab-tenant" data-icon="🙋">By Tenant</div>
    <div class="tab" data-v="whole" role="tab" tabindex="0" aria-selected="false" aria-controls="whole" id="tab-whole" data-icon="🏘">Whole Unit</div>
    <div class="tab" data-v="stats" role="tab" tabindex="0" aria-selected="false" aria-controls="stats" id="tab-stats" data-icon="📊">Stats</div>
    <div class="tab" data-v="landlords" role="tab" tabindex="0" aria-selected="false" aria-controls="landlords" id="tab-landlords" data-icon="🏢">Landlords</div>
    <div class="tab" data-v="alltenants" role="tab" tabindex="0" aria-selected="false" aria-controls="alltenants" id="tab-alltenants" data-icon="🙋‍♀️">All Tenants</div>
    <div class="tab" data-v="sales" role="tab" tabindex="0" aria-selected="false" aria-controls="sales" id="tab-sales" data-icon="🏡">For Sale</div>
    <div class="tab" data-v="revival" role="tab" tabindex="0" aria-selected="false" aria-controls="revival" id="tab-revival" data-icon="♻️">Revival</div>
  </div>
  <div class="hrow hbtnrow" style="margin-top:8px">
    <button class="hbtn" id="addtenant" type="button">+ Tenant</button>
    <button class="hbtn" id="dispatchchip" type="button">Dispatch <span class="cnt">0</span></button>
    <button class="hbtn" id="snoozechip" type="button">Snoozed <span class="cnt">0</span></button>
    <button class="hbtn" id="palettebtn" type="button" title="Command palette">⌘K Find</button>
    <button class="hbtn" id="themebtn" type="button" title="Toggle day/night">🌙</button>
    <button class="hbtn" id="densitybtn" type="button" title="Toggle density">☰ Density</button>
    <!-- (fix 9) lives here, not in .filters, so it stays reachable on
         mapview/stats where .filters is display:none. -->
    <button class="hbtn" id="bulkbtn" type="button">☑ Bulk action</button>
  </div>
  <div class="filters">
    <input id="q" placeholder="Search tenant, landlord, district, area, postal…" aria-label="Search tenant, landlord, district, area, or postal code">
    <select id="fd" aria-label="Filter by district"><option value="">All districts</option></select>
    <button id="filterstoggle" class="hbtn" type="button" aria-expanded="false" aria-controls="morefilters">Filters</button>
    <div class="chipstrip" id="chipstrip" aria-live="polite"></div>
    <span class="mut" id="resultcount" hidden></span>
    <button id="clr" class="tab" type="button" hidden>↺ Clear filters</button>
    <div id="morefilters" hidden>
      <select id="fv" aria-label="Filter by verdict">
        <option value="">All verdicts</option>
        <option value="QUALIFIED">Qualified</option>
        <option value="NEEDS_INFO">Needs info</option>
        <option value="BLOCKED">Has conflict</option>
      </select>
      <input id="fr" type="number" placeholder="Max rent $" style="width:120px" aria-label="Maximum rent filter">
      <label class="tog" id="fcwrap"><input type="checkbox" id="fc"> hide cold &gt;5d <span id="fccount" class="mut"></span></label>
      <label class="tog" id="fhwrap"><input type="checkbox" id="fh"> hide actioned <span id="fhcount" class="mut"></span></label>
      <select id="ft" aria-label="Filter by room type"><option value="">All room types</option></select>
      <select id="fg" aria-label="Filter by gender preference"><option value="">Any gender preference</option></select>
      <select id="fe" aria-label="Filter by race preference"><option value="">Any race preference</option></select>
      <select id="fs" aria-label="Filter by status"><option value="">All statuses</option></select>
      <select id="fk" aria-label="Filter by cooking rule"><option value="">Any cooking rule</option></select>
    </div>
  </div>
</header>
<main>
  <!-- (item 9) compact sticky filter summary — populated by renderFilterSummary()
       in app.js (see render() -> renderFilterBar()), reusing item 2's chip data.
       Sits right below the sticky header so scrolling a long roster never
       loses the active filters or the row count. -->
  <div id="filtersummary" class="sticky-ctx" hidden></div>
  <div id="work" role="tabpanel" aria-labelledby="tab-work"></div>
  <div id="pipeline" style="display:none" role="tabpanel" aria-labelledby="tab-pipeline"></div>
  <div id="listing" class="split" style="display:none" role="tabpanel" aria-labelledby="tab-listing">
    <div class="rail" id="lrail"></div>
    <div class="panel" id="lpanel"><div class="empty">Pick a listing on the left to see ranked tenants.</div></div>
  </div>
  <div id="tenant" class="split" style="display:none" role="tabpanel" aria-labelledby="tab-tenant">
    <div class="rail" id="trail"></div>
    <div class="panel" id="tpanel"><div class="empty">Pick a tenant on the left to see matching available listings.</div></div>
  </div>
  <div id="whole" style="display:none" role="tabpanel" aria-labelledby="tab-whole"></div>
  <div id="mapview" style="display:none" role="tabpanel" aria-labelledby="tab-mapview"></div>
  <div id="stats" style="display:none" role="tabpanel" aria-labelledby="tab-stats"></div>
  <div id="landlords" style="display:none" role="tabpanel" aria-labelledby="tab-landlords"></div>
  <div id="alltenants" style="display:none" role="tabpanel" aria-labelledby="tab-alltenants"></div>
  <div id="sales" style="display:none" role="tabpanel" aria-labelledby="tab-sales"></div>
  <div id="revival" style="display:none" role="tabpanel" aria-labelledby="tab-revival"></div>
  <div class="legend" id="legend"></div>
</main>
<script>const DATA = __DATA__;</script>
<script>
__SCORING__
</script>
<script>
__APP_JS__
</script>
</body>
</html>
