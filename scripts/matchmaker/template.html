<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Crestbrick Matchmaker</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matchmaker">
<style>/*__LEAFLET_CSS__*/</style>
<script>/*__LEAFLET_JS__*/</script>
<style>
/*__CSS__*/
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div>
      <h1>🏠 Crestbrick Rental Matchmaker</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <span class="chip mut" id="syncPill" title="CRM sync status">▣ local only</span>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Matchmaker views">
    <div class="tab on" data-v="mapview" role="tab" tabindex="0" aria-selected="true" aria-controls="mapview" id="tab-mapview" data-icon="🗺">Dashboard</div>
    <div class="tab" data-v="work" role="tab" tabindex="0" aria-selected="false" aria-controls="work" id="tab-work" data-icon="⭐">Worklist</div>
    <div class="tab" data-v="crm" role="tab" tabindex="0" aria-selected="false" aria-controls="crm" id="tab-crm" data-icon="🗂">CRM</div>
    <div class="tab" data-v="directory" role="tab" tabindex="0" aria-selected="false" aria-controls="directory" id="tab-directory" data-icon="📇">Directory</div>
  </div>
  <div class="hrow hbtnrow" style="margin-top:8px">
    <button class="hbtn" id="searchbtn" type="button">🔍 Search</button>
    <button class="hbtn" id="filtersbtn" type="button">▤ Filters</button>
    <button class="hbtn" id="menubtn" type="button">☰ Menu</button>
  </div>
  <!-- Search sheet (item 4): one box, its scope named in the placeholder, updated
       per tab and cleared automatically on every tab change — see render()'s
       LAST_ACTIVE_TAB check in app.js. Same #q element/oninput wiring that used
       to sit inline in the header; only its container changed. -->
  <div class="sheet-wrap" id="searchSheet" hidden>
    <div class="sheet">
      <div class="sheethead"><b>Search</b><button class="dclose" id="searchSheetClose" type="button" aria-label="Close">×</button></div>
      <div class="searchrow">
        <input id="q" placeholder="Search" aria-label="Search">
        <button id="searchClearX" class="btn" type="button" aria-label="Clear search">✕</button>
      </div>
    </div>
  </div>
  <!-- Filters sheet (item 3): the district/verdict/rent/cold/hide/room type/gender/
       race/status/cooking controls this app already had, unchanged, just opened on
       demand instead of sitting inline under every view. -->
  <div class="sheet-wrap" id="filtersSheet" hidden>
    <div class="sheet">
      <div class="sheethead"><b>Filters</b><button class="dclose" id="filtersSheetClose" type="button" aria-label="Close">×</button></div>
      <div class="filters">
        <select id="fd" aria-label="Filter by district"><option value="">All districts</option></select>
        <button id="filterstoggle" class="hbtn" type="button" aria-expanded="false" aria-controls="morefilters">More filters</button>
        <span class="mut" id="resultcount" hidden></span>
        <button id="clr" class="tab" type="button" hidden>↺ Clear filters</button>
        <div class="chipstrip" id="chipstrip" aria-live="polite"></div>
        <div id="morefilters" hidden>
          <select id="fv" aria-label="Filter by verdict">
            <option value="">All verdicts</option>
            <option value="QUALIFIED">Qualified</option>
            <option value="NEEDS_INFO">Needs info</option>
            <option value="BLOCKED">Has conflict</option>
          </select>
          <input id="fr" type="number" placeholder="Max rent $" style="width:120px" aria-label="Maximum rent filter">
          <label class="tog" id="fcwrap"><input type="checkbox" id="fc"> hide cold &gt;5d <span id="fccount" class="mut"></span></label>
          <label class="tog" id="fhwrap"><input type="checkbox" id="fh"> hide actioned <span id="fhcount" class="mut"></span></label>
          <select id="ft" aria-label="Filter by room type"><option value="">All room types</option></select>
          <select id="fg" aria-label="Filter by gender preference"><option value="">Any gender preference</option></select>
          <select id="fe" aria-label="Filter by race preference"><option value="">Any race preference</option></select>
          <select id="fs" aria-label="Filter by status"><option value="">All statuses</option></select>
          <select id="fk" aria-label="Filter by cooking rule"><option value="">Any cooking rule</option></select>
        </div>
      </div>
    </div>
  </div>
  <!-- Menu sheet (item 3): everything that used to be its own header button
       (add tenant, dispatch, snoozed, command palette, theme, bulk action) plus
       settings that lived on the old Stats tab (device name, backup export/
       restore). Density is gone entirely, not relocated — see app.js. -->
  <div class="drawer-wrap" id="menuSheet" hidden>
    <aside class="drawer" id="menuDrawer" role="dialog" aria-label="Menu">
      <div class="dhead"><h2>Menu</h2><button class="dclose" id="menuSheetClose" type="button" aria-label="Close">×</button></div>
      <div class="dbody" id="menuBody"></div>
    </aside>
  </div>
</header>
<main>
  <!-- (item 9) compact sticky filter summary — populated by renderFilterSummary()
       in app.js (see render() -> renderFilterBar()), reusing item 2's chip data.
       Sits right below the sticky header so scrolling a long roster never
       loses the active filters or the row count. -->
  <div id="filtersummary" class="sticky-ctx" hidden></div>

  <div id="mapview" style="display:none" role="tabpanel" aria-labelledby="tab-mapview"></div>
  <!-- Dashboard absorbs Stats as a section at the bottom — shown/hidden together
       with #mapview (see render() and GROUP_OF_VIEW in app.js), rendered
       separately by renderStats() so renderMapView()'s own box.innerHTML=""
       never wipes it. -->
  <div id="stats" style="display:none" role="tabpanel" aria-labelledby="tab-mapview"></div>

  <div id="work" role="tabpanel" aria-labelledby="tab-work"></div>
  <!-- Revival is a filter chip on the Worklist, not its own tab — shown/hidden
       together with #work, whichever the "Revival" chip currently selects. -->
  <div id="revival" style="display:none" role="tabpanel" aria-labelledby="tab-work"></div>

  <div id="crm" style="display:none" role="tabpanel" aria-labelledby="tab-crm"></div>
  <!-- Pipeline absorbs into CRM as a stage board section under the follow up
       queue — shown/hidden together with #crm. -->
  <div id="pipeline" style="display:none" role="tabpanel" aria-labelledby="tab-crm"></div>

  <!-- Directory: one view, a kind switch (Rooms/Tenants/Landlords/Whole units/For
       sale) selects which of the six existing rosters underneath is visible.
       Nothing here was deleted — every render function that used to have its own
       tab (listing/tenant/whole/landlords/alltenants/sales) still renders into the
       exact same container id it always did. -->
  <div id="directory" style="display:none" role="tabpanel" aria-labelledby="tab-directory">
    <div class="dirkindrow" id="dirkindrow"></div>
    <div id="listing" class="split" style="display:none">
      <div class="rail" id="lrail"></div>
      <div class="panel" id="lpanel"><div class="empty">Pick a listing on the left to see ranked tenants.</div></div>
    </div>
    <div id="tenant" class="split" style="display:none">
      <div class="rail" id="trail"></div>
      <div class="panel" id="tpanel"><div class="empty">Pick a tenant on the left to see matching available listings.</div></div>
    </div>
    <div id="whole" style="display:none"></div>
    <div id="landlords" style="display:none"></div>
    <div id="alltenants" style="display:none"></div>
    <div id="sales" style="display:none"></div>
  </div>

  <div class="legend" id="legend"></div>
</main>
<script>const DATA = __DATA__;</script>
<script>
__SCORING__
</script>
<script>
__APP_JS__
</script>
</body>
</html>
